name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Syntax and unit tests
        run: |
          for f in extension/src/*.js extension/ui/*.js; do node --check "$f"; done
          node --test extension/tests/*.test.cjs
      - name: Verify source checksums
        run: python3 scripts/checksums.py
      - name: Install browser test tools
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
      - name: Browser regression
        run: python3 scripts/browser-tests.py
      - name: Package and verify reproducibility
        run: |
          ./scripts/build.sh
          cp dist/*.zip.sha256 /tmp/bilithrottle-first.sha256
          ./scripts/build.sh
          diff /tmp/bilithrottle-first.sha256 dist/*.zip.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BiliThrottle-extension
          path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-regression
          path: extension/tests/*-results.json
