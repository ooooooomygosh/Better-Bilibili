name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check
        run: for f in extension/src/*.js extension/ui/*.js; do node --check "$f"; done
      - name: Unit tests
        run: node --test extension/tests/*.test.cjs
      - name: Verify checksums
        working-directory: extension
        run: sha256sum -c --quiet SHA256SUMS.txt
      - name: Package
        run: ./scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: BiliThrottle-extension
          path: dist/*.zip
