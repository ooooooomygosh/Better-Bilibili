name: Release

# Publishes a Release whenever extension/manifest.json carries a version that has no Release yet
# (on main or a working branch), or when a v* tag is pushed. Re-runs for an existing version are skipped.
on:
  push:
    branches: ["main", "claude/**"]
    paths: ["extension/manifest.json", ".github/workflows/release.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(node -p "require('./extension/manifest.json').version")"
          if gh release view "$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - name: Unit tests
        if: steps.check.outputs.exists == 'false'
        run: node --test extension/tests/core.test.cjs extension/tests/update.test.cjs extension/tests/focus.test.cjs
      - name: Check tag matches manifest version
        if: steps.check.outputs.exists == 'false' && startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./extension/manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Package
        if: steps.check.outputs.exists == 'false'
        id: pkg
        run: |
          ./scripts/build.sh
          echo "version=$(node -p "require('./extension/manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Extract release notes
        if: steps.check.outputs.exists == 'false'
        run: awk '/^## /{n++} n==1' extension/CHANGELOG.md > release-notes.md
      - uses: softprops/action-gh-release@v2
        if: steps.check.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: BTR Flow ${{ steps.pkg.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/BTR-Flow-${{ steps.pkg.outputs.version }}.zip
            dist/BTR-Flow-${{ steps.pkg.outputs.version }}.zip.sha256
