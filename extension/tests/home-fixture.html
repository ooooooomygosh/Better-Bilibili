<!doctype html><html lang="zh-CN" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BTR Flow · 本地首页回归页面（非真实站点）</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Arial,"Noto Sans CJK SC",sans-serif;color:#18191c;background:white}html{--bg1:#fff;--text1:#18191c;--brand_blue:#00aeec}.dark{--bg1:#18181b;--text1:#e3e5e7}.dark body{background:#18181b;color:#e3e5e7}a{color:inherit;text-decoration:none}button{cursor:pointer;color:inherit}.bili-header{position:relative;margin-bottom:20px}.bili-header__bar{position:absolute;inset:0 0 auto;height:64px;background:#fafafa;display:flex;align-items:center;justify-content:space-between;padding:0 3%;gap:24px}.dark .bili-header__bar{background:#232632}.bili-header__banner{height:154px;background:linear-gradient(110deg,#336a44,#375968)}.banner-art{padding:85px 8% 0;font-size:24px;color:white;letter-spacing:8px}.search{border:1px solid #7775;background:#8881;color:inherit;border-radius:6px;width:32%;padding:8px 14px} .header-channel{margin:auto;width:85%;padding:18px 0;display:flex;justify-content:space-between;gap:12px}.channel-link{border:0;background:#ddd2;border-radius:5px;padding:4px 16px;white-space:nowrap}.recommended-container_floor-aside{position:relative;width:85%;margin:auto}.container{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px;grid-auto-flow:row}.recommended-swipe{grid-column:span 2;grid-row:span 2;aspect-ratio:1.42;display:flex;align-items:center;justify-content:center;text-align:center;background:linear-gradient(150deg,#9498db,#f1c3de);border-radius:8px;color:#fff;font-size:26px}.feed-card:nth-of-type(n+8){display:none}.feed-card:nth-of-type(n+5){margin-top:20px}.bili-video-card{min-width:0;border-radius:6px;background:#fff}.dark .bili-video-card{background:#232632}.bili-video-card__image{aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:6px}.bili-video-card__image img{width:100%;height:100%;object-fit:cover;display:block}.bili-video-card__info{padding:0 6px 8px}.bili-video-card__info--tit{font-size:15px;line-height:22px;margin:8px 0 6px;height:44px;overflow:hidden;font-weight:500}.bili-video-card__info--author{font-size:12px;opacity:.65}.bili-video-card__stats__duration{position:absolute;bottom:4px;right:7px;color:#fff;text-shadow:0 1px 3px #000;font-size:12px}.roll-btn{position:absolute;top:0;right:-46px;width:36px;background:#7772;border:1px solid #7774;border-radius:6px;writing-mode:vertical-lr;padding:8px 7px}.watch-later{display:none;position:absolute;right:5px;top:5px;border:0;border-radius:3px;background:#000b;color:white}.bili-video-card:hover .watch-later{display:block}.foot{width:85%;margin:30px auto;opacity:.55;font-size:12px}.spacer{height:600px}@media(max-width:1399px){.container{grid-template-columns:repeat(4,minmax(0,1fr))}.header-channel{overflow:auto}}@media(max-width:1000px){.container{grid-template-columns:repeat(3,minmax(0,1fr))}.channel-link{padding:4px 8px}}@media(max-width:700px){.container{grid-template-columns:repeat(2,minmax(0,1fr))}.bili-header__bar{font-size:11px;gap:6px}.search{width:30%}.recommended-container_floor-aside,.header-channel{width:90%}.roll-btn{right:0}.bili-video-card__info--tit{font-size:13px}}
</style></head><body>
<div id="i_cecream"><div class="bili-header"><div class="bili-header__banner"><div class="banner-art">季节横幅 · 默认保留</div></div><div class="bili-header__bar"><span>首页　番剧　直播　漫画</span><input class="search" placeholder="搜索视频"><span>动态　收藏　历史　创作中心</span></div><div class="header-channel"><button class="channel-link">热门</button><button class="channel-link">科技</button><button class="channel-link">知识</button><button class="channel-link">音乐</button><button class="channel-link">影视</button><button class="channel-link">美食</button><button class="channel-link">汽车</button><button class="channel-link">更多</button></div></div>
<main><section class="recommended-container_floor-aside"><button class="roll-btn">换一换</button><div class="container"></div></section></main><p class="foot">本地合成回归页面，仅用于测试布局与交互。不是登录 B 站后的截图。</p><div class="spacer"></div></div>
<script>
window.batch=1;window.refreshCalls=0;window.nativeClicks=0;window.refreshMode='normal';
window.makeCard=(batch,i)=>{const holder=document.createElement('article');holder.className='feed-card';holder.innerHTML=`<div class="bili-video-card"><div class="bili-video-card__image"><a href="/video/BV${batch}fixture${i}"><img alt="" src="https://i0.hdslb.com/bfs/archive/fixture-${i}.jpg"></a><span class="bili-video-card__stats__duration">12:34</span><button class="watch-later" aria-label="稍后再看">稍后再看</button></div><div class="bili-video-card__info"><h3 class="bili-video-card__info--tit"><a href="/video/BV${batch}fixture${i}">第 ${batch} 批 · 测试视频 ${i+1}：原生标题、封面与交互仍然保留</a></h3><span class="bili-video-card__info--author">测试 UP 主 ${i+1}</span></div></div>`;holder.querySelector('.watch-later').onclick=()=>nativeClicks++;return holder;};
window.renderBatch=(number,count=10)=>{const grid=document.querySelector('.container');grid.replaceChildren();const swipe=document.createElement('div');swipe.className='recommended-swipe';swipe.textContent='大图活动轮播\n占用两列两行';grid.append(swipe);for(let i=0;i<count;i++)grid.append(makeCard(number,i));};
window.invokeRefresh=()=>{refreshCalls++;if(refreshMode==='none')return;const n=++batch;if(refreshMode==='partial'){renderBatch(n,3);setTimeout(()=>renderBatch(n,10),1800);}else setTimeout(()=>renderBatch(n,10),150);};
renderBatch(1);document.querySelector('.roll-btn').onclick=invokeRefresh;
</script></body></html>
