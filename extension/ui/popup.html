<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哔哩节流阀</title><link rel="stylesheet" href="common.css"></head><body class="popup">
<div class="row between"><div><div class="brand">BILITHROTTLE · 哔哩节流阀</div><h1>该快就快，该停就停。</h1></div><label class="row" title="视频加速总开关"><span class="toggle-label">加速</span><span class="switch"><input id="enabled" type="checkbox" role="switch" aria-label="启用视频加速"><span></span></span></label></div>
<div class="metrics"><div class="metric"><strong id="speed">—</strong><span>网络下载 MiB/s</span></div><div class="metric"><strong id="buffer">—</strong><span>连续缓冲 / 秒</span></div><div class="metric"><strong id="threads">—</strong><span>在途请求</span></div></div>
<div id="focusUsage" class="usage" aria-live="polite"></div><div id="profile" class="muted">打开 B 站视频后显示状态</div><hr class="divider">
<div class="stack"><div class="field"><label for="strategy">观看策略</label><select id="strategy"><option value="auto">自动 · 按视频和播放状态调整</option><option value="smooth">稳播优先 · 更充分地预缓冲</option><option value="fast">起播优先 · 减少初始等待</option><option value="economy">省流 · 限制预取和自动并发</option></select></div>
<div class="field"><label for="mode">CDN 路线</label><select id="mode"><option value="auto">自动 · 原始地址 + 大陆 + 海外</option><option value="mainland">大陆优先</option><option value="overseas">海外优先</option><option value="custom">自定义 · 在原版设置里选节点</option></select></div></div>
<p id="warning" class="fine"></p><div class="actions"><button id="native">原版详细设置</button><button id="options" class="primary">增强版设置</button></div>
<p id="message" class="fine" role="status"></p><p class="fine">2.0.1 · 基于线程撕裂者的非官方衍生版</p><script src="../src/focus-core.js"></script><script src="popup.js"></script></body></html>
