<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>哔哩节流阀</title><script src="../src/ui-kit.js"></script><link rel="stylesheet" href="common.css"></head><body class="popup">
<div class="row between"><div><div class="brand">BILITHROTTLE · 哔哩节流阀</div><h1>该快就快，该停就停。</h1></div><label class="row" title="视频加速总开关"><span class="toggle-label">加速</span><span class="switch"><input id="enabled" type="checkbox" role="switch" aria-label="启用视频加速"><span></span></span></label></div>
<div class="metrics" id="metrics" hidden><div class="metric"><strong id="speed">0.00</strong><span>网络下载 MiB/s</span></div><div class="metric"><strong id="buffer">0.0</strong><span>连续缓冲 / 秒</span></div><div class="metric"><strong id="threads">0</strong><span>在途请求</span></div></div>
<p id="profile" class="state-line" aria-live="polite">打开 B 站视频后，这里显示下载速度和缓冲。</p>
<p id="lockline" class="lockline" hidden></p>
<div id="focusUsage" class="usage" aria-live="polite"></div><hr class="divider">
<label class="row between sb-row" for="sbEnabled"><span><b class="sb-title">空降助手</b><span class="fine sb-hint" id="sbHint">自动跳过恰饭、片头等片段</span></span><span class="switch"><input id="sbEnabled" type="checkbox" role="switch" aria-describedby="sbHint"><span></span></span></label>
<div class="pv-block"><div class="row between pv-row"><span><b class="sb-title">悬停预览</b><span class="fine sb-hint" id="pvHint">首页无限下滑的卡片</span></span><div class="pv-seg" id="homePreview" role="radiogroup" aria-label="悬停预览" aria-describedby="pvHint"><button type="button" role="radio" data-v="video">视频播放</button><button type="button" role="radio" data-v="frames">逐帧</button><button type="button" role="radio" data-v="off">关闭</button></div></div>
<label class="row between sb-row pv-mute" for="homePreviewMuted"><span><b class="sb-title">悬停播放静音</b><span class="fine sb-hint" id="pvmHint">卡片右下角的喇叭也能切换，会记住</span></span><span class="switch"><input id="homePreviewMuted" type="checkbox" role="switch" aria-describedby="pvmHint"><span></span></span></label></div>
<div class="stack"><div class="field"><label for="strategy">观看策略</label><select id="strategy"><option value="auto">自动 · 按视频和播放状态调整</option><option value="smooth">稳播优先 · 更充分地预缓冲</option><option value="fast">起播优先 · 减少初始等待</option><option value="economy">省流 · 限制预取和自动并发</option></select></div>
<div class="field"><label for="mode">CDN 路线</label><select id="mode"><option value="auto">自动 · 原始地址 + 大陆 + 海外</option><option value="mainland">大陆优先</option><option value="overseas">海外优先</option><option value="custom">自定义 · 在原版设置里选节点</option></select></div></div>
<div class="reload" id="reload" hidden><span>播放加速开关要刷新页面后才对当前视频生效。</span><button type="button" class="small primary" id="reloadBtn">刷新当前页</button></div>
<p id="warning" class="fine"></p><div class="actions"><button id="quick">页面快捷面板</button><button id="options" class="primary">完整设置</button></div>
<p id="message" class="fine" role="status"></p><p class="fine">2.5.2 · 基于线程撕裂者的非官方衍生版 · <a href="welcome.html" target="_blank">使用指南</a></p><script src="../src/focus-core.js"></script><script src="popup.js"></script></body></html>
